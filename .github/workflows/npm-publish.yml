name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" != "$VERSION" ]; then npm version "$VERSION" --no-git-tag-version; fi
      - run: npm run build
      - run: npm test

      - name: Publish
        # Trusted publishing (OIDC): no NPM_TOKEN needed. Configure once at
        # npmjs.com → package Settings → Trusted Publisher → GitHub Actions
        # (org fiale-plus, repo jev-cli, workflow npm-publish.yml).
        run: npm publish --provenance --access public

      - name: Verify publication
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sleep 10
          npm view @fiale-plus/jev-cli@"$VERSION"
