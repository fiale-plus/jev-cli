name: Publish to npm

# Staged publishing: the workflow submits the tarball, a maintainer approves it
# with 2FA. Trusted publishers created after 2026-09-03 are staging-only, so
# "npm publish" is rejected by the registry even with a valid OIDC token — the
# supported path is "npm stage publish" plus manual approval.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Staged publishing needs npm >= 11.15.0; the version bundled with Node may
      # be older (11.6.x rejects "npm stage" as an unknown command).
      - name: Ensure a staging-capable npm CLI
        run: |
          npm install -g npm@latest
          npm --version

      # The release tag is the source of truth for what users install. A mismatch
      # is a hard failure: silently rewriting the version ships an unreviewed tree.
      - name: Check the tag matches the committed version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION. Tag v$VERSION or bump the package."
            exit 1
          fi
          echo "Staging @fiale-plus/jev-cli@$VERSION"

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Stage on npm
        # Provenance attestations are generated automatically for trusted
        # publishers; --access public keeps the scoped package readable.
        run: npm stage publish --access public

      - name: Report what to approve
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npm stage list @fiale-plus/jev-cli || true
          {
            echo "### Staged @fiale-plus/jev-cli@$VERSION"
            echo
            echo "Approve with 2FA to move it to prod:"
            echo
            echo '```'
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "Or use the Staged Packages tab on npmjs.com."
          } >> "$GITHUB_STEP_SUMMARY"
